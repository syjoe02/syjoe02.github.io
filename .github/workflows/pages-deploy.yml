name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - .gitignore
      - LICENSE
      - README.md
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A PR run gets its own group so it never cancels a deploy of main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4
        if: github.event_name != 'pull_request'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        run: node --test 'tests/*.test.js'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
